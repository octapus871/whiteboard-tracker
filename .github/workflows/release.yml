name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (.deb & .rpm)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libssl-dev

      - name: Read version from Cargo.toml
        id: meta
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json, sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo binstall -y cargo-deb cargo-generate-rpm

      - name: Package .deb and .rpm
        run: |
          mkdir -p dist
          cargo deb --no-build
          mv target/debian/*.deb "dist/whiteboard-tracker-${{ steps.meta.outputs.version }}-amd64.deb"
          cargo generate-rpm
          mv target/generate-rpm/*.rpm "dist/whiteboard-tracker-${{ steps.meta.outputs.version }}-x86_64.rpm"
          ls -lh dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (portable .zip & Inno Setup .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Read version from Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create portable .zip
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $stage = "dist\whiteboard-tracker-$version-windows-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\whiteboard_tracker.exe" "$stage\whiteboard_tracker.exe"
          Copy-Item "LICENSE" "$stage\LICENSE"
          Copy-Item "assets\OFL.txt" "$stage\OFL.txt"
          Compress-Archive -Path $stage -DestinationPath "dist\whiteboard-tracker-$version-windows-x86_64-portable.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $iscc = $defaultPath
            } else {
              choco install innosetup -y --no-progress
              $iscc = $defaultPath
            }
          }
          & $iscc "/DMyAppVersion=$version" "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon .app .zip — experimental)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Read version from Cargo.toml
        id: meta
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json, sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create .app bundle and .zip
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          APP_DIR="dist/Whiteboard Tracker.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp target/release/whiteboard_tracker "$APP_DIR/Contents/MacOS/whiteboard_tracker"
          chmod +x "$APP_DIR/Contents/MacOS/whiteboard_tracker"
          cp LICENSE "$APP_DIR/Contents/Resources/LICENSE"
          cp assets/OFL.txt "$APP_DIR/Contents/Resources/OFL.txt"

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>Whiteboard Tracker</string>
            <key>CFBundleExecutable</key>
            <string>whiteboard_tracker</string>
            <key>CFBundleIdentifier</key>
            <string>io.github.whiteboard-tracker</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Whiteboard Tracker</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/whiteboard-tracker-${VERSION}-macos-arm64.zip"
          rm -rf "$APP_DIR"
          ls -lh dist/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [linux, windows, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-artifacts
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined bundle (workflow_dispatch dry-run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-artifacts/*

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
