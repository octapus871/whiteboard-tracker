[package]
name = "whiteboard_tracker"
version = "0.1.0"
description = "Swiss-grid visual task & mind-map desktop tracker"
license = "MIT"
edition = "2021"

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
arabic_reshaper = "0.4.2"
unicode-bidi = "0.3"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/whiteboard_tracker", dest = "/usr/bin/whiteboard_tracker", mode = "755" },
    { source = "packaging/whiteboard_tracker.desktop", dest = "/usr/share/applications/whiteboard_tracker.desktop", mode = "644" },
    { source = "packaging/whiteboard_tracker.svg", dest = "/usr/share/icons/hicolor/scalable/apps/whiteboard_tracker.svg", mode = "644" },
]

[package.metadata.deb]
maintainer = "Whiteboard Tracker Contributors"
copyright = "2026, Whiteboard Tracker Contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
A fast, lightweight, local-first desktop task and mind-map tracker with a \
Swiss-grid architectural layout, nested horizontal mind-map trees, inline notes, \
daily profiles, and bilingual English (LTR) and Arabic (RTL) support."""
depends = "$auto"
recommends = "zenity | kdialog"
section = "utils"
priority = "optional"
assets = [
    ["target/release/whiteboard_tracker", "usr/bin/whiteboard_tracker", "755"],
    ["packaging/whiteboard_tracker.desktop", "usr/share/applications/whiteboard_tracker.desktop", "644"],
    ["packaging/whiteboard_tracker.svg", "usr/share/icons/hicolor/scalable/apps/whiteboard_tracker.svg", "644"],
    ["assets/OFL.txt", "usr/share/doc/whiteboard_tracker/OFL.txt", "644"],
]
